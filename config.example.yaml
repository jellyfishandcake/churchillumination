# Copy this file to config.yaml and adjust for your machine (laptop dev vs
# the Raspberry Pi). config.yaml is gitignored since it holds machine-
# specific settings (GPIO pin numbers, MQTT broker address, etc). Any key
# you omit falls back to the default in src/config.py.

# "0.0.0.0" listens on the whole local network (not just this machine),
# so phones on the same WiFi can reach contribute.html (e.g. via the QR
# code shown on index.html). Same private-LAN-only trust model as the
# admin passcode below - not a real security boundary beyond that.
server:
  host: 0.0.0.0
  port: 8000

leds:
  # Virtual/dashboard-only total across every output.type "led" zone - feeds
  # the browser's pixel map + sketch-canvas sampling. Doesn't map to one
  # physical chain anymore - see "strips" below for the real per-chain
  # hardware config. Keep this equal to the sum of every led zone's
  # output.pixels: heart_rate 60 (1m strip) + accelerometer 94 (5 arm
  # segments, 19+17+20+16+22 - see ShakeFireworkEffect.ARM_LENGTHS). weather is a DMX
  # bar, not counted here.
  num_pixels: 154
  layout: strip   # strip|grid|ring — only "strip" is implemented so far (see web/pixelMap.js)
  # Final output multiplier applied after gamma correction, right before
  # pixels go to hardware - the APA102 driver's own brightness byte is
  # already left at its hardware max (see src/output/leds.py), so this is
  # the actual "make the strip brighter/dimmer" knob. >1.0 boosts (clips
  # per-channel at 255 rather than rescaling, so bright highlights can
  # flatten to white instead of dimming the whole frame to compensate),
  # 1.0 leaves effects' own output untouched, <1.0 dims everything. Only
  # affects `led` zones - a `dmx` zone's own dimmer channel (if its mode has
  # one) is the equivalent knob there.
  brightness: 1.4
  # Real APA102 hardware chains - heart_rate and accelerometer are two
  # independent chains (NOT data-connected to each other - separate
  # data+clock pin pairs, not one continuous strip spliced together), each
  # its own LEDStrip/SPI bus (see main.py's main()). Each led zone below
  # picks one via output.strip. accelerometer_strip is on SPI1 (GPIO 20/21,
  # confirmed 2026-08-10) - needs `dtoverlay=spi1-3cs` added to
  # /boot/firmware/config.txt + a reboot before /dev/spidev1.0 exists.
  # spi_speed_hz is optional per strip, defaults to LEDStrip's own 8MHz if
  # omitted - override to test a lower clock speed while diagnosing
  # glitching/off-palette pixels, e.g. heart_rate_strip: {..., spi_speed_hz: 1000000}.
  # Worth trying first if a strip's data/clock lines run straight off the
  # Pi's 3.3V GPIO with no level shifter (heart_rate_strip's case, confirmed
  # 2026-08-18) - 8MHz doesn't leave much margin at 3.3V into a nominally
  # 5V-logic part, and the same glitch reproduced identically after moving
  # the same physical strip onto accelerometer_strip's separate SPI1 pins,
  # which rules out "these specific GPIO pins" as the cause.
  strips:
    heart_rate_strip: {num_pixels: 60, spi_bus: 0, spi_device: 0}
    accelerometer_strip: {num_pixels: 94, spi_bus: 1, spi_device: 0}
  # Named sections of the installation. Each runs its own effect+palette
  # (see src/output/effects/), driven by one or more named sensor signals.
  # A source value is either a dot-path resolved against server.latest each
  # tick, or {path, min, max} to linearly rescale a reading that isn't
  # already 0..1 (e.g. temperature in °C). "sensors.*" reaches any sensor's
  # smoothed raw reading (server.latest["sensors"], every sensor's flat
  # merged output - see main.py's sensor_loop); "state.*"/"heart_rate.*"/
  # "interactions.*" reach the specific hand-curated fields those publish.
  # See main.py's _resolve_sources/output_loop.
  #
  # A zone's source dict keys must match its chosen effect's step()
  # parameter names - organic_wave/organic_comet/organic_twinkle/
  # reactive_glow all take `intensity`; temp_humidity_bar takes
  # `temperature`+`humidity`+`condition`+`activated`+`history` (the last two
  # gate its periodic past-24h replay; `history` is unrescaled - see its
  # `raw: true` source below); shake_firework takes just `intensity`;
  # audio_reactive_wave takes `loudness`+`motion`+`env_brightness`+`ripple`;
  # heart_rate_check_in takes `intensity`+`bpm`, same as pulse. See
  # src/output/effects/registry.py's own docstring for the full breakdown of
  # which effect suits which zone shape.
  #
  # `output` says which hardware the zone actually drives:
  #   {type: led, strip: name, pixels: N}  - a slice of one of the
  #     independent APA102 chains in "strips" above (`strip` must be a key
  #     there - modular/reorderable panels - detachable clips - but one
  #     continuous electrical chain per strip, so reordering panels
  #     physically just means reordering the `led` zones sharing that strip
  #     in this list; zones on *different* strips are never electrically
  #     connected at all). Changeable at runtime from admin.html's Zones tab
  #     (public dashboard is read-only - see web/index.html). `pixels`
  #     across all `led` zones sharing one strip should sum to that strip's
  #     own num_pixels; output_loop pads/clamps the last zone on that strip
  #     if they don't, rather than crashing.
  #   {type: dmx, start_address: N, channels: [...], pixels: N} - a DMX512
  #     fixture (e.g. an RGB/RGBW wall-washer bar) over a USB-DMX interface,
  #     driven in parallel with the strips - see src/output/dmx.py and
  #     main.py's output_loop. Needs dmx.enabled below set true. Not yet
  #     live-swappable from admin.html - edit config.yaml + restart to
  #     change a dmx zone's effect/palette. channels lists the role of each
  #     DMX channel in the fixture's current mode (check its manual/DIP
  #     switches): r/g/b/w map to colour, "dimmer" holds at 255 (many
  #     fixtures show black regardless of RGB if their master dimmer
  #     channel is 0), "strobe" holds at 0 (no strobe) - e.g.
  #     [dimmer, r, g, b] for a 4ch mode with a master dimmer channel first.
  #     `pixels` (default 1) is the confirmed independently-addressable
  #     segment count in that mode - each segment gets its own consecutive
  #     block of `channels`. Only set this above 1 once you've actually
  #     confirmed segment addressing with tools/test_dmx.py's --start
  #     flag - don't assume it from a spec sheet.
  zones:
    - name: ambient
      effect: audio_reactive_wave   # organic_wave | organic_comet | organic_twinkle | pulse | temp_humidity_bar | reactive_glow | shake_firework | audio_reactive_wave | heart_rate_check_in
      palette: winter            # any key in colour_palette.PALETTES / palettes.json
      source:
        loudness: sensors.loudness                                # picks position in the palette gradient - see AudioReactiveWaveEffect's docstring
        motion: sensors.motion                                    # drives wave speed
        env_brightness: {path: sensors.lux, min: 0, max: 500}     # keeps the strip visible against room light rather than reacting to loudness/motion - untested placeholder range, recalibrate on-site
        ripple: interactions.audio_ripple                         # laughter/applause/cheering/music flash - see intelligence/audio_moments.py
      # Two of the RGB fixture (8 segments x 3 big bulbs each = 24ch)
      # chained back-to-back, addressed as one continuous 16-segment run
      # rather than two separate zones - audio_reactive_wave's gradient
      # spreads across both bars as a single wave. Bar 1's channels 1-24
      # confirmed via test_dmx.py --start probing; bar 2 needs its own
      # start_address set to 25 on its display/DIP switches before pixels:
      # 16 is anything but a guess - confirm with test_dmx.py bar --start 1
      # --count 16 the same way.
      output: {type: dmx, start_address: 1, channels: [r, g, b], pixels: 16}
    - name: weather   # renamed from temp_humidity 2026-08-19
      effect: temp_humidity_bar   # rebuilt 2026-08-18 into a three-layer ambient/shimmer/touch design, see led_effects.py's TempHumidityBarEffect docstring
      palette: winter   # ambient base colour still comes from CONDITION_COLOURS per condition, not this - but the shimmer/touch-burst layers DO sample this palette now (2026-08-19, see TempHumidityBarEffect._vivid_boost), so it's no longer purely decorative
      source:
        temperature: {path: sensors.temperature, min: 15, max: 30}   # indoor reading - drives the touch-react rising-edge detector, see TempHumidityBarEffect.TOUCH_TRIGGER_DELTA
        contrast: {path: sensors.indoor_outdoor_temp_diff, min: 0, max: 15}   # indoor/outdoor divergence, drives the shimmer layer - see main.py's sensor_loop
        condition: {path: sensors.outdoor_condition_code, min: 0, max: 5}   # weather.py's _CONDITION_ORDER index (clear/cloudy/fog/rain/snow/storm) - must match TempHumidityBarEffect.CONDITION_ORDER
      # RGBW bar fixture - 4 channels/segment. start_address moved to 49
      # (2026-08-15, the block right after ambient's now-16-segment/48ch
      # span from adding a second bar there) - was 25, confirmed 2026-08-11
      # by setting the fixture's own display to match; that same step needs
      # redoing at 49 before this is anything but a guess, same as before.
      # pixels: 28 is still the original segment-count guess from 2026-08-07
      # - not yet re-confirmed against the real fixture now that it's
      # actually addressable (see tools/test_dmx.py bar --count, e.g. try
      # 32, to check for a dark "front bit" beyond the addressed range
      # before trusting this number).
      output: {type: dmx, start_address: 49, channels: [r, g, b, w], pixels: 28}
    - name: heart_rate
      effect: heart_rate_check_in   # start/read/end check-in flow, not a continuous display - see HeartRateEffect's docstring
      palette: festive
      source:
        intensity: heart_rate.engaged        # bool -> 1.0/0.0, rising edge starts a new reading session
        bpm: {path: heart_rate.bpm, min: 40, max: 180}   # must match HeartRateEffect.BPM_RANGE
      output: {type: led, strip: heart_rate_strip, pixels: 60}   # 1m strip, confirmed 2026-08-07
    - name: accelerometer
      effect: shake_firework   # vigorous shake fires every arm at once from the hub, no direction involved - see ShakeFireworkEffect's docstring (replaced tri_arm_glide 2026-08-19)
      palette: autumn
      source:
        intensity: interactions.acceleration_raw                     # NOT sensors.acceleration (smoothed) - ShakeFireworkEffect is an instant trigger and needs the real, unsmoothed spike - see main.py's sensor_loop comment on acceleration_raw
      # On its own independent chain (accelerometer_strip, SPI1) - NOT
      # data-connected to heart_rate. 94 = 19+17+20+16+22: physically the
      # same 4 arms confirmed 2026-08-10 post-soldering (36/20/16/22,
      # radiating from a shared hub), with arm 1 (36px) now treated as two
      # wiring segments (19+17, confirmed 2026-08-19) since it doesn't run
      # hub-to-tip for its whole length - see
      # ShakeFireworkEffect.ARM_LENGTHS/ARM_REVERSED.
      output: {type: led, strip: accelerometer_strip, pixels: 94}

# Interface-level DMX512 settings - which zones actually send to it, and
# each fixture's start_address/channels, are configured per-zone above
# (leds.zones[].output). Off by default: this is bring-up/test gear
# (borrowed fixture, unconfirmed interface). Before flipping `enabled` to
# true, run `python -m tools.test_dmx ports` to find the interface, then
# `python -m tools.test_dmx solid 255 0 0` to confirm it actually drives
# the fixture, and check the fixture's manual/DIP switches for its real
# start_address + channel mode (update the zones above to match).
dmx:
  enabled: false
  port: null   # null = auto-detect an FTDI/CH340 serial port; set e.g. "COM5" if that picks the wrong device

# How long (in seconds) the installation stays "activated" after the last
# presence detection before falling back to idle. See src/intelligence/activation.py.
activation:
  timeout_seconds: 300.0

# Isolated interaction signals, each debounced the same way "activated"
# above is, but kept separate from it and from mood/activity_level - see
# main.py's sensor_loop and CLAUDE.md's "isolated regions" design.
interaction:
  hr_contact_timeout_seconds: 5.0     # how long the heart-rate zone stays "engaged" after the last finger contact
  motion_burst_timeout_seconds: 8.0   # how long a handheld-stick shake counts as a motion burst

# Shared passcode gating admin-only terminal controls. CHANGE THIS — sent in
# plaintext over the local websocket, a low-security gate for a private LAN
# only, not a real security boundary.
admin:
  passcode: changeme

sensors:
  audio:
    enabled: true

  # Central MLX90640 thermal camera (frame-diff based motion). Falls back
  # to a mock if the sensor/its library isn't present. motion_range_low/high
  # (°C, absolute frame-diff mean) is the band `motion` ramps 0..1 across -
  # replaced a single multiplicative `sensitivity` 2026-08-19 once on-site
  # data showed why that shape can't work (a nonzero idle floor can't be
  # separated from the ceiling by scaling alone - see motion.py's own
  # comments for the numbers). human_temp_range_low/high (°C, absolute) is
  # the separate band web/shadow.html's shadow-cast blob mask ramps 0..1
  # across - high end lowered 34.0->31.0 2026-08-18, since thermal_frame_max
  # topped out at 31.95°C in that data (34.0 may never have been reachable
  # at all). All from real on-site data at this point, not by-feel guesses
  # - see motion.py's own comments for the numbers behind them. Retune
  # further with `python -m tools.calibrate_sensor motion --live` if needed.
  motion:
    enabled: true
    motion_range_low: 0.45
    motion_range_high: 1.0
    human_temp_range_low: 24.0
    human_temp_range_high: 31.0

  # Pimoroni Multi-Sensor Stick (BME280 + LTR559), wired over a longer I2C
  # cable so it can sit away from the Pi and read true room conditions
  # instead of the Pi's own heat/vibration. Falls back to a mock if the
  # pimoroni-bme280/ltr559 libraries or the board aren't present.
  multisensor:
    enabled: true

  # Mini PIR motion sensor on GPIO - the *central* one only. The 2
  # node-mounted PIRs are on the ESP32 boards themselves (see `nodes`
  # below), not wired to the Pi. Falls back to a mock off the Pi.
  # Disabled by default (2026-08-17) in favour of mmwave below - see its
  # comment for why. Left here, not deleted, as the fallback if mmwave
  # needs to be backed out.
  pir:
    enabled: false
    gpio_pin: 17   # was 4 - moved to 17 when disabled in favour of mmwave (below), which now occupies the one physically-soldered pin instead

  # Waveshare HMMD mmWave presence sensor (S3KM1110, 24GHz FMCW radar) -
  # replaced pir above as the default 2026-08-17, since PIR only fires on
  # movement (a stationary person can "disappear" from presence, which
  # matters more now that the weather zone's replay mode - and
  # activity_level itself, see rules.py's activated-gate - depend on
  # sustained presence). NOT meant to run alongside pir - both publish the
  # same "presence" key, see src/sensing/mmwave.py's docstring. gpio_pin 17 -
  # the one pin that's actually soldered (moved onto pir's old pin above);
  # confirm against the presence-output pin's actual silkscreen label if
  # rewired (VCC -> Pi 3.3V, NOT 5V - see mmwave.py's own wiring note).
  mmwave:
    enabled: true
    gpio_pin: 17

  # DFRobot Gravity/Fermion MAX30102 heart-rate/SpO2 sensor over I2C - the
  # module computes HR/SpO2 on its own onboard MCU. Falls back to a mock
  # off the Pi.
  heart_rate:
    enabled: true

  # Handheld M5Stack ESP32S3 accelerometer stick, wired to the Pi over
  # USB-serial (a physical tether, not WiFi/MQTT - simpler, and keeps it
  # from walking off). Falls back to a mock if the port isn't present.
  accel_stick:
    enabled: true
    serial_port: /dev/ttyACM0  # M5Stick's native ESP32-S3 USB-serial (VID 303A) on the Pi - was /dev/ttyUSB0 until 2026-08-17, which is actually the DMX dongle (FTDI, VID 0403), a real different device that opened fine but never sent valid readings - a stale copy of that old value on the Pi cost real debugging time, don't reintroduce it. e.g. COM3 on Windows dev machines instead.
    baud_rate: 115200

  # 2 Seeed XIAO ESP32S3 Sense nodes (each with mic + MLX90640 thermal
  # camera + PIR), publishing readings over MQTT. Falls back to mock
  # readings per node if the broker is unreachable or a node hasn't
  # published yet.
  nodes:
    enabled: true
    mqtt_host: localhost
    mqtt_port: 1883
    node_ids:
      - node1
      - node2

  # Outdoor weather via Open-Meteo (open-meteo.com) - free, no API key or
  # account needed. Fetched on a slow background thread (every 10 minutes,
  # see FETCH_INTERVAL_SECONDS in src/sensing/weather.py), not every tick -
  # weather doesn't change fast enough to justify more, and hammering a
  # free public API at 20Hz would be both wasteful and rude. Falls back to
  # a mock if the network/API is unreachable, same as every other sensor.
  # Defaults to Churchill College, Cambridge - override if the site moves.
  weather:
    enabled: true
    latitude: 52.2153
    longitude: 0.0983
