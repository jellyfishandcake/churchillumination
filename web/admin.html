<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Computing — Admin</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { max-width: 640px; margin-inline: auto; }
    #login-error { color: var(--error); font-size: 0.85rem; margin-top: 0.5rem; }
    #controls { display: none; }
    .tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
    .tab-button {
      background: var(--panel-bg);
      color: var(--ink);
      border: 1px solid var(--hairline);
      font-family: var(--font-label);
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-button:hover:not(.active) { border-color: var(--accent); }
    .tab-button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <h1>Admin <span id="status">connecting…</span></h1>

  <div class="panel" id="login-panel">
    <h2>Log in</h2>
    <div class="field">
      <span class="field-label">Passcode</span>
      <input type="password" id="passcode-input">
    </div>
    <div class="field">
      <span></span>
      <button id="login-button">Log in</button>
    </div>
    <div id="login-error"></div>
  </div>

  <div id="controls">
    <div class="tabs">
      <button class="tab-button" data-tab="sensors">Sensors</button>
      <button class="tab-button" data-tab="tuning">Tuning</button>
      <button class="tab-button" data-tab="override">Override</button>
      <button class="tab-button" data-tab="status">Status</button>
    </div>

    <div id="tab-sensors" class="tab-content">
      <div class="panel">
        <h2>Sensors</h2>
        <div id="sensor-toggles"></div>
      </div>
    </div>

    <div id="tab-tuning" class="tab-content">
      <div class="panel">
        <h2>Tuning</h2>
        <div class="field">
          <span class="field-label">Activation timeout (s)<small>How long the installation stays "activated" after last presence</small></span>
          <input type="number" id="activation-timeout-input" min="1" step="1">
        </div>
        <div class="field">
          <span class="field-label">Smoothing alpha<small>Lower = calmer, higher = snappier</small></span>
          <input type="range" id="smoothing-alpha-input" min="0" max="1" step="0.01">
          <span id="smoothing-alpha-value"></span>
        </div>
      </div>
    </div>

    <div id="tab-override" class="tab-content">
      <div class="panel">
        <h2>Manual state override</h2>
        <div class="field">
          <span class="field-label">Mood</span>
          <select id="override-mood-select">
            <option value="idle">idle</option>
            <option value="calm">calm</option>
            <option value="neutral">neutral</option>
            <option value="lively">lively</option>
          </select>
        </div>
        <div class="field">
          <span class="field-label">Activity level</span>
          <input type="range" id="override-activity-input" min="0" max="1" step="0.01">
          <span id="override-activity-value"></span>
        </div>
        <div class="field">
          <span></span>
          <span>
            <button id="apply-override-button">Apply</button>
            <button id="clear-override-button">Clear</button>
          </span>
        </div>
      </div>
    </div>

    <div id="tab-status" class="tab-content">
      <div class="panel">
        <h2>Status</h2>
        <pre id="status-readout">—</pre>
      </div>
    </div>
  </div>

  <div id="back-link"><a href="/index.html">← Back to dashboard</a></div>

  <script src="/wsClient.js"></script>
  <script src="/tabs.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
