<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Computing — Live</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f14;
      color: #e8e8ea;
      margin: 0;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin-inline: auto;
    }
    h1 { grid-column: 1 / -1; font-weight: 300; margin: 0 0 1rem; }
    .panel {
      background: #1a1a22;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .panel h2 { margin-top: 0; font-weight: 400; font-size: 1rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #2a2a35; }
    .metric:last-child { border-bottom: none; }
    .metric-label { color: #888; }
    .metric-value { font-variant-numeric: tabular-nums; font-weight: 500; }
    .bar { height: 6px; background: #2a2a35; border-radius: 3px; overflow: hidden; margin-top: 0.25rem; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #4a9eff, #ff6b6b); transition: width 100ms; }
    #status { font-size: 0.85rem; color: #666; }
    #status.connected { color: #4ade80; }
    #sketch-container { grid-column: 1 / -1; background: #000; border-radius: 8px; overflow: hidden; }
    #sketch-container canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Creative Computing <span id="status">connecting…</span></h1>
 
  <div class="panel">
    <h2>Sensors</h2>
    <div class="metric">
      <span class="metric-label">Noise level</span>
      <span class="metric-value" id="noise-value">—</span>
    </div>
    <div class="bar"><div class="bar-fill" id="noise-bar" style="width: 0%"></div></div>
    <div class="metric" style="margin-top: 1rem;">
      <span class="metric-label">Activity</span>
      <span class="metric-value" id="activity-value">—</span>
    </div>
    <div class="bar"><div class="bar-fill" id="activity-bar" style="width: 0%"></div></div>
  </div>
 
  <div class="panel">
    <h2>Inferred State</h2>
    <div class="metric">
      <span class="metric-label">Mood</span>
      <span class="metric-value" id="mood-value">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">Presence</span>
      <span class="metric-value" id="presence-value">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">LED hue</span>
      <span class="metric-value" id="hue-value">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">Brightness</span>
      <span class="metric-value" id="brightness-value">—</span>
    </div>
  </div>
 
  <div id="sketch-container"></div>
 
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
  <script src="/pixelMap.js"></script>
  <script src="/sketch.js"></script>
  <script src="/app.js"></script>
</body>
</html>
